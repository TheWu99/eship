spring.application.name=eship

# H2 In-Memory Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration (same as main)
jwt.secret=eShipSecretKeyForJWTTokenGenerationPleaseChangeInProduction
jwt.expiration=86400000

# Server Configuration
server.port=8080
