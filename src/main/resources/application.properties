spring.application.name=eship

# PostgreSQL 16 Database Configuration
# IMPORTANT: For production, use environment variables or secure configuration
spring.datasource.url = jdbc:postgresql://127.0.0.1:5432/eship?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username =zichao
spring.datasource.password = zichao01
# spring.datasource.url=jdbc:postgresql://localhost:5432/eship
# spring.datasource.username=postgres
# spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# IMPORTANT: For production, use environment variables and a strong secret (min 32 bytes)
jwt.secret=eShipSecretKeyForJWTTokenGenerationPleaseChangeInProduction
jwt.expiration=86400000

# Server Configuration
server.port=8080

# UPS API Configuration
# Register at https://developer.ups.com to get credentials
ups.api.client-id=${UPS_CLIENT_ID:your_ups_client_id_here}
ups.api.client-secret=${UPS_CLIENT_SECRET:your_ups_client_secret_here}
ups.api.account-number=${UPS_ACCOUNT_NUMBER:your_ups_account_number_here}
# Use CIE (test) or production URLs
ups.api.base-url=https://wwwcie.ups.com/api
ups.api.oauth-url=https://wwwcie.ups.com/security/v1/oauth/token
# For production, use:
# ups.api.base-url=https://onlinetools.ups.com/api
# ups.api.oauth-url=https://onlinetools.ups.com/security/v1/oauth/token
ups.api.timeout=30000
# FedEx API Configuration
# Register at https://developer.fedex.com to get credentials
fedex.api.client-id=${FEDEX_CLIENT_ID:your_fedex_client_id_here}
fedex.api.client-secret=${FEDEX_CLIENT_SECRET:your_fedex_client_secret_here}
fedex.api.account-number=${FEDEX_ACCOUNT_NUMBER:your_fedex_account_number_here}
# Use sandbox (test) or production URLs
fedex.api.base-url=https://apis-sandbox.fedex.com
fedex.api.oauth-url=https://apis-sandbox.fedex.com/oauth/token
# For production, use:
# fedex.api.base-url=https://apis.fedex.com
# fedex.api.oauth-url=https://apis.fedex.com/oauth/token
fedex.api.timeout=30000
# DHL API Configuration
# Register at https://developer.dhl.com to get credentials
dhl.api.api-key=${DHL_API_KEY:your_dhl_api_key_here}
dhl.api.api-secret=${DHL_API_SECRET:your_dhl_api_secret_here}
dhl.api.account-number=${DHL_ACCOUNT_NUMBER:your_dhl_account_number_here}
# Use sandbox or production URLs
dhl.api.base-url=https://api-sandbox.dhl.com
dhl.api.oauth-url=https://api-sandbox.dhl.com/oauth/token
# For production, use:
# dhl.api.base-url=https://api.dhl.com
# dhl.api.oauth-url=https://api.dhl.com/oauth/token
dhl.api.timeout=30000
