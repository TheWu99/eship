spring.application.name=eship

# PostgreSQL 16 Database Configuration
# IMPORTANT: For production, use environment variables or secure configuration
spring.datasource.url = jdbc:postgresql://127.0.0.1:5432/eship?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username =zichao
spring.datasource.password = zichao01
# spring.datasource.url=jdbc:postgresql://localhost:5432/eship
# spring.datasource.username=postgres
# spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# IMPORTANT: For production, use environment variables and a strong secret (min 32 bytes)
jwt.secret=eShipSecretKeyForJWTTokenGenerationPleaseChangeInProduction
jwt.expiration=86400000

# Server Configuration
server.port=8080

# UPS API Configuration
# Register at https://developer.ups.com to get credentials
ups.api.client-id=${UPS_CLIENT_ID:your_ups_client_id_here}
ups.api.client-secret=${UPS_CLIENT_SECRET:your_ups_client_secret_here}
ups.api.account-number=${UPS_ACCOUNT_NUMBER:your_ups_account_number_here}
# Use CIE (test) or production URLs
ups.api.base-url=https://wwwcie.ups.com/api
ups.api.oauth-url=https://wwwcie.ups.com/security/v1/oauth/token
# For production, use:
# ups.api.base-url=https://onlinetools.ups.com/api
# ups.api.oauth-url=https://onlinetools.ups.com/security/v1/oauth/token
ups.api.timeout=30000
